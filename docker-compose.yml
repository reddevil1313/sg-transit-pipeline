x-hdfs: &hdfs
  build: ./hdfs
  image: sg-transit-hdfs
  platform: linux/amd64
  environment: &hdfs-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
    HDFS-SITE.XML_dfs.replication: 1
    HDFS-SITE.XML_dfs.permissions.enabled: "false"
    HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
    HADOOP_HEAPSIZE_MAX: 256m

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --bootstrap-server $$B --create --if-not-exists --topic bus.arrivals.raw --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic bus.alerts --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --list

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles: [ui]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      LTA_ACCOUNT_KEY: ${LTA_ACCOUNT_KEY}
      BUS_STOPS: ${BUS_STOPS:-10379,10369,14039,14029,14379,14031,10361,10371}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_OPTS: -Xmx64m
    restart: unless-stopped

  namenode:
    <<: *hdfs
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    environment:
      <<: *hdfs-env
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    volumes:
      - namenode:/hadoop/dfs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeInfo' | grep -q '\"Safemode\" : \"\"'"]
      interval: 10s
      timeout: 30s
      retries: 20

  datanode:
    <<: *hdfs
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    volumes:
      - datanode:/hadoop/dfs

  hdfs-init:
    <<: *hdfs
    depends_on:
      namenode:
        condition: service_healthy
    command: ["hdfs", "dfs", "-mkdir", "-p", "/lake/reference", "/lake/bronze", "/lake/silver", "/lake/gold"]

  reference-loader:
    build: ./reference
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      LTA_ACCOUNT_KEY: ${LTA_ACCOUNT_KEY}
      WEBHDFS_URL: http://namenode:9870/webhdfs/v1

  spark-bronze:
    build: ./streaming
    image: sg-transit-spark
    container_name: spark-bronze
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "512m", "/app/bronze_ingest.py"]
    ports:
      - "4040:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      HDFS_URL: hdfs://namenode:8020
    restart: unless-stopped

volumes:
  kafkadata:
  namenode:
  datanode:
